<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>statusbar test</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100dvh; overflow: hidden;
  }
  body {
    position: fixed; inset: 0;
    background: linear-gradient(180deg, #ff3b6b 0%, #7b2ff7 40%, #1e3c72 100%);
    font-family: -apple-system, monospace;
    color: #fff;
  }
  #topband {
    position: fixed; top: 0; left: 0; right: 0; height: 12px;
    background: repeating-linear-gradient(45deg, #ffe600 0 8px, #111 8px 16px);
    z-index: 10;
  }
  #redline {
    position: fixed; left: 0; right: 0; bottom: 0; height: 4px;
    background: red; z-index: 999999; pointer-events: none;
  }
  #panel {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font: 16px/1.8 monospace; white-space: pre;
    background: rgba(0,0,0,0.55); padding: 16px 20px; border-radius: 10px;
  }
</style>
</head>
<body>
  <div id="topband"></div>
  <div id="redline"></div>
  <div id="panel">loading...</div>
  <script>
    const probeTop = document.createElement('div');
    probeTop.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px);';
    document.body.appendChild(probeTop);
    const probeBottom = document.createElement('div');
    probeBottom.style.cssText = 'position:fixed;bottom:0;left:0;width:0;height:0;visibility:hidden;padding-bottom:env(safe-area-inset-bottom,0px);';
    document.body.appendChild(probeBottom);

    function update() {
      const insetTop = parseFloat(getComputedStyle(probeTop).paddingTop) || 0;
      const insetBottom = parseFloat(getComputedStyle(probeBottom).paddingBottom) || 0;
      document.getElementById('panel').textContent =
        'standalone:   ' + (navigator.standalone === true) + '\n' +
        'inset-top:    ' + insetTop + '\n' +
        'inset-bottom: ' + insetBottom + '\n' +
        'innerHeight:  ' + window.innerHeight + '\n' +
        'screen.height:' + screen.height;
    }
    update();
    setInterval(update, 1000);
    window.addEventListener('resize', update);
  </script>
</body>
</html>
