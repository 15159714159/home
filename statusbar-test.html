<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>scroll test</title>
<style>
  /* 实验：文档级滚动能否让内容钻到状态栏(时钟)底下。
     html 底色 = 渐变顶色，静止时状态栏应无缝；往上滑动时观察
     文字行是否延伸进时钟区域(参照站效果)。 */
  html { background: #ff3b6b; }
  html, body { margin: 0; padding: 0; }
  body {
    background: linear-gradient(180deg, #ff3b6b 0%, #7b2ff7 50%, #1e3c72 100%);
    font-family: -apple-system, monospace;
    color: #fff;
  }
  .line {
    font-size: 28px; font-weight: 700; padding: 18px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.25);
  }
  #panel {
    position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
    font: 14px/1.7 monospace; white-space: pre;
    background: rgba(0,0,0,0.6); padding: 10px 14px; border-radius: 10px;
    z-index: 10;
  }
</style>
</head>
<body>
  <div id="content"></div>
  <div id="panel">loading...</div>
  <script>
    let html = '';
    for (let i = 1; i <= 60; i++) html += '<div class="line">第 ' + i + ' 行 · 滑我 · SCROLL ' + i + '</div>';
    document.getElementById('content').innerHTML = html;
    function update() {
      document.getElementById('panel').textContent =
        'standalone:  ' + (navigator.standalone === true) + '\n' +
        'scrollY:     ' + Math.round(window.scrollY) + '\n' +
        'innerHeight: ' + window.innerHeight;
    }
    update();
    window.addEventListener('scroll', update, { passive: true });
    setInterval(update, 1000);
  </script>
</body>
</html>
